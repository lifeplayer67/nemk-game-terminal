<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Станція «НЕМК» — навчальний термінал</title>
<style>
/* ============================================================
   СТАНЦІЯ «НЕМК» — ретро-CRT термінал
   Один самодостатній файл. Без зовнішніх ресурсів.
   ============================================================ */
* { margin: 0; padding: 0; box-sizing: border-box; }

:root {
  --green:  #35ff6d;   /* основний фосфорний */
  --green-dim: #1d8f47;
  --green-dark: #0a3418;
  --amber:  #ffb347;   /* попередження / підказки */
  --red:    #ff5a5a;   /* тривога */
  --bg:     #030803;
}

html, body { height: 100%; }

body {
  background: var(--bg);
  color: var(--green);
  font-family: "Cascadia Mono", Consolas, Menlo, "Liberation Mono", "Courier New", monospace;
  font-size: 18px;
  line-height: 1.45;
  overflow: hidden;
  text-shadow: 0 0 5px rgba(53, 255, 109, 0.45);
}

/* ---------- CRT-ефекти: скан-лінії, віньєтка, мерехтіння ---------- */
#crt-overlay {
  position: fixed; inset: 0;
  pointer-events: none;
  z-index: 90;
  background: repeating-linear-gradient(
    to bottom,
    transparent 0px, transparent 2px,
    rgba(0, 0, 0, 0.16) 2px, rgba(0, 0, 0, 0.16) 4px
  );
  animation: flicker 4s infinite;
}
#crt-vignette {
  position: fixed; inset: 0;
  pointer-events: none;
  z-index: 91;
  background: radial-gradient(ellipse at center,
    transparent 55%, rgba(0, 0, 0, 0.42) 100%);
}
@keyframes flicker {
  0%, 100% { opacity: 1; }
  92%      { opacity: 1; }
  93%      { opacity: 0.86; }
  94%      { opacity: 1; }
  97%      { opacity: 0.93; }
}

/* ---------- Каркас екрана ---------- */
#app {
  height: 100vh;
  display: grid;
  grid-template-rows: auto 1fr auto;
}

header {
  display: flex;
  align-items: center;
  gap: 18px;
  padding: 8px 16px;
  border-bottom: 1px solid var(--green-dim);
  font-size: 16px;
  letter-spacing: 1px;
  white-space: nowrap;
}
header .title { font-weight: bold; }
header .spacer { flex: 1; }
#link-ind { color: var(--green-dim); animation: softblink 2.2s infinite; }
@keyframes softblink { 0%,100% { opacity: 1; } 50% { opacity: 0.45; } }

#main {
  display: flex;
  min-height: 0;
}

/* ---------- Головний екран термінала ---------- */
#screen {
  flex: 1;
  min-width: 0;
  overflow-y: auto;
  padding: 18px 24px 28px;
  scrollbar-width: thin;
  scrollbar-color: var(--green-dim) var(--bg);
}
#screen::-webkit-scrollbar { width: 8px; }
#screen::-webkit-scrollbar-thumb { background: var(--green-dark); }

#scene {
  color: var(--green-dim);
  text-shadow: 0 0 4px rgba(53, 255, 109, 0.3);
  font-size: 15px;
  line-height: 1.25;
  margin-bottom: 14px;
  white-space: pre;
  overflow-x: auto;
  /* сцена «прилипає» до верху екрана, щоб анімації завжди було видно */
  position: sticky;
  top: -18px;
  z-index: 2;
  background: var(--bg);
  border-bottom: 1px solid var(--green-dark);
  padding: 6px 0 10px;
}

#story .line { min-height: 1.45em; margin-bottom: 2px; white-space: pre-wrap; }
.line.warn  { color: var(--amber); text-shadow: 0 0 5px rgba(255, 179, 71, 0.4); }
.line.alert { color: var(--red);   text-shadow: 0 0 5px rgba(255, 90, 90, 0.4); }
.line.ok    { color: #9dffbe; }
.line.exec  {
  color: #c8ffdc;
  background: rgba(53, 255, 109, 0.07);
  border-left: 3px solid var(--green-dim);
  padding: 2px 8px;
  margin: 6px 0;
}
.line.dim   { color: var(--green-dim); }

/* ---------- Конструктор коду ---------- */
#workarea { margin-top: 14px; }

form.construct {
  border: 1px dashed var(--green-dim);
  padding: 14px 16px;
  max-width: 760px;
}
.codeline {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 6px;
  font-size: 20px;
  margin-bottom: 6px;
}
.codeline .tok { white-space: pre; }
.codeline .brk { width: 100%; height: 6px; }

input.fld, select.fld {
  background: #041505;
  color: var(--green);
  border: 1px solid var(--green-dim);
  font: inherit;
  font-size: 19px;
  padding: 3px 8px;
  text-shadow: inherit;
}
input.fld { width: 9ch; }
input.fld.narrow { width: 5ch; text-align: center; }
select.fld { cursor: pointer; }
select.fld option { background: #041505; color: var(--green); }

input.fld:focus-visible, select.fld:focus-visible,
button:focus-visible, a:focus-visible {
  outline: 2px solid var(--amber);
  outline-offset: 2px;
}

/* м'яке підсвічення незаповненого поля — без «помилок» */
.fld.need {
  border-color: var(--amber);
  animation: needpulse 0.9s infinite;
}
@keyframes needpulse {
  0%, 100% { box-shadow: 0 0 0 0 rgba(255, 179, 71, 0); }
  50%      { box-shadow: 0 0 10px 2px rgba(255, 179, 71, 0.45); }
}

button.btn {
  background: transparent;
  color: var(--green);
  border: 1px solid var(--green);
  font: inherit;
  font-size: 19px;
  padding: 7px 22px;
  margin-top: 10px;
  cursor: pointer;
  text-shadow: inherit;
  letter-spacing: 1px;
}
button.btn:hover:not(:disabled) { background: var(--green-dark); }
button.btn:disabled { opacity: 0.4; cursor: default; }
button.btn.big { font-size: 22px; padding: 12px 34px; }

/* ---------- Довідник (панель праворуч) ---------- */
#help {
  display: flex;
  border-left: 1px solid var(--green-dim);
  background: rgba(3, 20, 6, 0.6);
}
#help-toggle {
  background: transparent;
  border: none;
  color: var(--amber);
  font: inherit;
  font-size: 16px;
  cursor: pointer;
  padding: 14px 10px;
  writing-mode: vertical-rl;
  text-orientation: mixed;
  letter-spacing: 3px;
  animation: softblink 1.8s infinite;
  text-shadow: 0 0 5px rgba(255, 179, 71, 0.4);
}
#help.open #help-toggle { animation: none; }
#help.pulse #help-toggle { animation: softblink 0.7s infinite; }
#help-body {
  display: none;
  width: 340px;
  padding: 16px 18px;
  overflow-y: auto;
  font-size: 16px;
}
#help.open #help-body { display: block; }
#help-body h3 {
  color: var(--amber);
  font-size: 17px;
  margin-bottom: 10px;
  letter-spacing: 1px;
}
#help-body p { margin-bottom: 10px; }
#help-body pre {
  background: #041505;
  border: 1px solid var(--green-dark);
  padding: 8px 10px;
  margin: 10px 0;
  font-size: 15px;
  white-space: pre-wrap;
  color: #c8ffdc;
}
#help-body .analogy {
  border-left: 3px solid var(--amber);
  padding: 6px 10px;
  color: var(--amber);
  margin-top: 12px;
  font-size: 15px;
}

/* ---------- Рядок стану ---------- */
#statusbar {
  border-top: 1px solid var(--green-dim);
  padding: 8px 16px;
  font-size: 16px;
  min-height: 38px;
  color: var(--amber);
  text-shadow: 0 0 5px rgba(255, 179, 71, 0.35);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
#statusbar::before { content: "▸ "; }

/* ---------- Пролог: «зламаний» екран ---------- */
#prologue {
  position: fixed; inset: 0;
  z-index: 80;
  background: var(--bg);
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 26px;
  cursor: pointer;
}
#prologue .noise {
  position: absolute; inset: 0;
  background: repeating-linear-gradient(
    to bottom,
    transparent 0 26px,
    rgba(53, 255, 109, 0.05) 26px 29px,
    transparent 29px 61px,
    rgba(255, 90, 90, 0.04) 61px 63px
  );
  animation: noise-roll 1.1s linear infinite;
  pointer-events: none;
}
@keyframes noise-roll {
  from { background-position-y: 0; }
  to   { background-position-y: 63px; }
}
#prologue pre.glitch {
  color: var(--red);
  font-size: 17px;
  text-shadow: 0 0 8px rgba(255, 90, 90, 0.6);
  animation: glitch-jerk 2.7s infinite;
  white-space: pre;
}
@keyframes glitch-jerk {
  0%, 100% { transform: translateX(0) skewX(0deg); opacity: 1; }
  8%   { transform: translateX(3px)  skewX(2deg); }
  9%   { transform: translateX(-4px) skewX(-3deg); opacity: 0.7; }
  10%  { transform: translateX(0); opacity: 1; }
  46%  { transform: translateX(-2px); }
  47%  { transform: translateX(2px) skewX(1deg); opacity: 0.8; }
  48%  { transform: translateX(0); opacity: 1; }
}
#prologue-btn {
  background: transparent;
  border: 1px dashed var(--red);
  color: var(--red);
  font: inherit;
  font-size: 21px;
  padding: 14px 26px;
  cursor: pointer;
  animation: softblink 1s infinite;
  text-shadow: 0 0 8px rgba(255, 90, 90, 0.6);
}

.hidden { display: none !important; }

@media (max-width: 1440px) {
  #help-body { width: 300px; }
}
</style>
</head>
<body>

<!-- CRT-накладки: скан-лінії та віньєтка -->
<div id="crt-overlay"></div>
<div id="crt-vignette"></div>

<!-- Пролог: «зламаний» екран із SOS -->
<div id="prologue">
  <div class="noise"></div>
  <pre class="glitch">
▓▒░ ЗБІЙ СИСТЕМИ ░▒▓   ▓▒░ ЗБ#Й СИ$ТЕ_И ░▒▓

   ..--==[ S O S ]==--..
   СТАНЦІЯ «НЕМК» ПІД АТАКОЮ
   БОРТОВИЙ КОМП'ЮТЕР ПОШКОДЖЕНО
   ПОТРІБЕН ОПЕРАТОР-ЛЮДИНА
</pre>
  <button id="prologue-btn">&gt;&gt;&gt; SOS ... натисни ENTER, щоб відновити зв'язок &lt;&lt;&lt;</button>
</div>

<!-- Основний каркас -->
<div id="app">
  <header>
    <span class="title">СТАНЦІЯ «НЕМК»</span>
    <span id="mission-ind">•</span>
    <span class="spacer"></span>
    <span id="link-ind">ЗВ'ЯЗОК: ОК</span>
    <button id="snd-btn" class="btn" style="margin:0; font-size:15px; padding:4px 10px;">ЗВУК: УВІМК</button>
  </header>

  <div id="main">
    <main id="screen">
      <pre id="scene"></pre>
      <div id="story"></div>
      <div id="workarea"></div>
    </main>

    <aside id="help">
      <button id="help-toggle" aria-expanded="false" aria-controls="help-body">[?] ДОВІДНИК</button>
      <div id="help-body"></div>
    </aside>
  </div>

  <div id="statusbar">Очікування сигналу…</div>
</div>

<script>
"use strict";
/* ============================================================
   СТАНЦІЯ «НЕМК» — рушій гри
   Всі місії описані ДЕКЛАРАТИВНО у масиві MISSIONS нижче:
   викладач може змінювати тексти, підказки й перевірки,
   не чіпаючи сам рушій.
   ============================================================ */

/* ----------- ТЕКСТ-ПЛЕЙСХОЛДЕР ЗАПРОШЕННЯ (легко замінити) ----------- */
var INVITE_TEXT = [
  "Сподобалося керувати станцією?",
  "Приходь навчатися до нашого коледжу — і навчишся створювати",
  "такі програми по-справжньому!",
  "[ Тут — текст запрошення коледжу: спеціальності, контакти, сайт ]"
];

/* ================= КОРОТКІ ПОСИЛАННЯ НА DOM ================= */
var $ = function (sel) { return document.querySelector(sel); };
var elScreen   = $("#screen");
var elScene    = $("#scene");
var elStory    = $("#story");
var elWork     = $("#workarea");
var elStatus   = $("#statusbar");
var elMission  = $("#mission-ind");
var elPrologue = $("#prologue");
var elHelp     = $("#help");
var elHelpBody = $("#help-body");
var elHelpTgl  = $("#help-toggle");

/* ================= СТАН ГРИ ================= */
var game = {
  state: "prologue",   // prologue | play | finale
  mission: 0,          // індекс поточної місії
  step: 0,             // індекс кроку всередині місії
  vars: {}             // спільні дані між кроками (назва функції, залп тощо)
};
var epoch = 0;         // «покоління» екрана: захищає від застарілих анімацій після скидання
var busy  = false;     // true під час анімації успіху — блокує повторний ВИКОНАТИ

/* ================= ЗВУК (Web Audio, без файлів) ================= */
var audioCtx = null;
var soundOn = true;

function ensureAudio() {
  // Створюємо аудіоконтекст лише після жесту користувача (вимога браузерів)
  if (!audioCtx) {
    try {
      audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    } catch (e) { soundOn = false; }
  }
  if (audioCtx && audioCtx.state === "suspended") { audioCtx.resume(); }
}

function beep(freq, dur, vol, type) {
  if (!soundOn || !audioCtx) return;
  try {
    var o = audioCtx.createOscillator();
    var g = audioCtx.createGain();
    o.type = type || "square";
    o.frequency.value = freq;
    g.gain.setValueAtTime(vol, audioCtx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + dur);
    o.connect(g); g.connect(audioCtx.destination);
    o.start();
    o.stop(audioCtx.currentTime + dur);
  } catch (e) { /* звук — не критична функція */ }
}
function clickBeep() { beep(1100, 0.012, 0.02); }
function okBeep()    { beep(660, 0.09, 0.06); setTimeout(function () { beep(990, 0.14, 0.06); }, 100); }
function warnBeep()  { beep(240, 0.16, 0.06, "sawtooth"); }

$("#snd-btn").addEventListener("click", function () {
  soundOn = !soundOn;
  if (soundOn) ensureAudio();
  this.textContent = soundOn ? "ЗВУК: УВІМК" : "ЗВУК: ВИМК";
});

/* ================= ДРУКАРСЬКА МАШИНКА ================= */
var typing = false;        // чи йде зараз посимвольний друк
var skipRequested = false; // Enter/клік — додрукувати миттєво

function sleep(ms) { return new Promise(function (r) { setTimeout(r, ms); }); }
function scrollDown() { elScreen.scrollTop = elScreen.scrollHeight; }

// Додати готовий рядок миттєво (для анімацій результату)
function print(text, cls) {
  var el = document.createElement("div");
  el.className = "line" + (cls ? " " + cls : "");
  el.textContent = text;
  elStory.appendChild(el);
  scrollDown();
  return el;
}

// Надрукувати один рядок посимвольно
async function typeLine(text, cls, myEpoch) {
  var el = document.createElement("div");
  el.className = "line" + (cls ? " " + cls : "");
  elStory.appendChild(el);
  for (var i = 0; i < text.length; i++) {
    if (epoch !== myEpoch) return;           // екран скинуто — тихо виходимо
    if (skipRequested) break;                // гравець просить одразу весь текст
    el.textContent += text[i];
    if (i % 3 === 0) clickBeep();
    scrollDown();
    await sleep(14);
  }
  if (epoch === myEpoch) { el.textContent = text; scrollDown(); }
}

// Надрукувати блок сюжету; рядки можуть мати префікси стилю:
//   "!! " — тривога (червоний), "! " — попередження (бурштин), ". " — тьмяний
async function typeStory(lines, myEpoch) {
  skipRequested = false;
  typing = true;
  setStatus("Йде передача даних… (ENTER — показати одразу)");
  for (var i = 0; i < lines.length; i++) {
    if (epoch !== myEpoch) { typing = false; return; }
    var text = lines[i], cls = "";
    if (text.indexOf("!! ") === 0)     { cls = "alert"; text = text.slice(3); }
    else if (text.indexOf("! ") === 0) { cls = "warn";  text = text.slice(2); }
    else if (text.indexOf(". ") === 0) { cls = "dim";   text = text.slice(2); }
    if (skipRequested) { print(text, cls); }
    else {
      await typeLine(text, cls, myEpoch);
      await sleep(90);
    }
  }
  typing = false;
}

/* ================= РЯДОК СТАНУ ТА ПІДКАЗКИ ================= */
function setStatus(text) { elStatus.textContent = text; }

// Доброзичлива сюжетна підказка: бурштиновий рядок + рядок стану + м'який звук.
// Жодних «Error» — лише порада, що зробити далі.
function storyHint(text) {
  print("※ " + text, "warn");
  setStatus(text);
  warnBeep();
}

/* ================= ASCII-СЦЕНИ ================= */
var ART = {};

ART.stantsiya = [
  "      .        *            .           *",
  "  *        ______________________         .",
  "     ====[   СТАНЦІЯ  «Н Е М К»   ]====",
  "         [   o    o    o    o     ]      *",
  "  .       \\______________________/",
  "      *          |      |            .",
  "                /________\\"
].join("\n");

ART.shchyt = function (energia) {
  return [
    "            _.-=====================-._",
    "         .-'   ЩИТ СТАНЦІЇ: energia = " + energia + "   '-.",
    "        (  ~  ~  ~  ~  ~  ~  ~  ~  ~  ~  )",
    "     ====[      СТАНЦІЯ  «Н Е М К»      ]====",
    "         [      o    o    o    o        ]",
    "          \\______________________________/"
  ].join("\n");
};

// Обшивка станції (місія 3): 8 секцій, лічильник пробоїн і ОДИН ремонтний робот.
// fixed — число заварених підряд АБО масив із 8 булевих значень;
// pos   — секція, під якою зараз стоїть робот (0 — робот у доку, 9 — «шукає неіснуючу»)
ART.obshyvka = function (fixed, pos) {
  var arr = (fixed instanceof Array) ? fixed : null;
  var cells = "", zavareno = 0;
  for (var i = 0; i < 8; i++) {
    var ok = arr ? arr[i] : (i < fixed);
    if (ok) zavareno++;
    cells += ok ? "[▓]" : "[X]";
  }
  function sp(n) { return new Array(Math.max(0, n) + 1).join(" "); }
  var out = [
    "   ЛІЧИЛЬНИК ПРОБОЇН: залишилось " + (8 - zavareno) + " з 8",
    "",
    "   " + cells + "      [X] — пробоїна   [▓] — заварено"
  ];
  if (pos >= 1) {
    var center = 3 + (Math.min(pos, 9) - 1) * 3 + 1; // колонка секції, де стоїть робот
    out.push(sp(center) + "▲");
    out.push(sp(center - 2) + "[o_o]  ← ремонтний робот (він у нас один!)");
  } else {
    out.push("");
    out.push("   [o_o]  ← ремонтний робот (він у нас один!)");
  }
  return out.join("\n");
};

ART.ataka = function (khvyli) {
  // хвилі металоїдів, що наближаються
  var roi = "";
  for (var i = 0; i < khvyli; i++) { roi += "  ~v~  ~v~  ~v~"; }
  return [
    "  МЕТАЛОЇДИ:" + (khvyli > 0 ? roi : "  (обрій чистий)"),
    "",
    "     ====[   СТАНЦІЯ  «Н Е М К»   ]====",
    "         [   o    o    o    o     ]",
    "          \\______________________/"
  ].join("\n");
};

ART.flahman = [
  "         ___________________________",
  "   <====[   ФЛАГМАН  МЕТАЛОЇДІВ    ]====>",
  "         \\_/\\_/\\_/\\_/\\_/\\_/\\_/\\_/\\_/",
  "",
  "",
  "     ====[   СТАНЦІЯ  «Н Е М К»   ]====",
  "         [   o    o    o    o     ]"
].join("\n");

ART.peremoha = [
  "                 \\  |  /",
  "         *  --==<  БАБАХ  >==--  *",
  "                 /  |  \\",
  "",
  "   ═══════  П  Е  Р  Е  М  О  Г  А  ═══════",
  "",
  "     ====[   СТАНЦІЯ  «Н Е М К»   ]====",
  "         [   o    o    o    o     ]   ура!"
].join("\n");

// Ряд роботів для місії 1 (показуємо до 8, решту — числом)
function robotyArt(n) {
  var shown = Math.min(n, 8);
  var r1 = "", r2 = "";
  for (var i = 0; i < shown; i++) { r1 += " [o_o] "; r2 += " /| |\\ "; }
  var extra = n > shown ? ("   … і ще " + (n - shown) + " у другому ряду") : "";
  return ART.stantsiya + "\n\n" + r1 + extra + "\n" + r2;
}

function setScene(text) { elScene.textContent = text || ""; }

/* ================= ДОВІДНИК ================= */

function setHelpPage(key) {
  var page = HELP[key];
  if (!page) return;
  elHelpBody.innerHTML = "";
  var h = document.createElement("h3");
  h.textContent = page.title;
  elHelpBody.appendChild(h);
  page.text.forEach(function (t) {
    var p = document.createElement("p");
    p.textContent = t;
    elHelpBody.appendChild(p);
  });
  var pre = document.createElement("pre");
  pre.textContent = page.code;
  elHelpBody.appendChild(pre);
  var an = document.createElement("div");
  an.className = "analogy";
  an.textContent = page.analogy;
  elHelpBody.appendChild(an);
}

elHelpTgl.addEventListener("click", function () {
  var open = elHelp.classList.toggle("open");
  elHelpTgl.setAttribute("aria-expanded", open ? "true" : "false");
  elHelp.classList.remove("pulse");
  clickBeep();
});

/* ================= ПОБУДОВА ФОРМИ-КОНСТРУКТОРА ================= */

// Знайти опис поля за ключем
function fieldDef(st, key) {
  for (var i = 0; i < st.fields.length; i++) {
    if (st.fields[i].key === key) return st.fields[i];
  }
  return null;
}

// Створити елемент поля (select / назва / число)
function makeField(def, st) {
  var el;
  if (def.kind === "select") {
    el = document.createElement("select");
    el.className = "fld";
    def.options.forEach(function (o) {
      var opt = document.createElement("option");
      opt.value = o.v;
      opt.textContent = o.label;
      el.appendChild(opt);
    });
  } else {
    el = document.createElement("input");
    el.type = "text";
    el.className = "fld";
    el.autocomplete = "off";
    el.spellcheck = false;
    if (def.placeholder) el.placeholder = def.placeholder;
    if (def.kind === "name") {
      el.maxLength = 12;
      // Назва: лише a-z та _, цифри дозволені, але не на початку.
      // Заборонені символи просто не вводяться — з м'якою підказкою.
      el.addEventListener("input", function () {
        var v = this.value;
        var cleaned = v.toLowerCase().replace(/[^a-z0-9_]/g, "").replace(/^[0-9]+/, "");
        if (cleaned !== v) {
          this.value = cleaned;
          setStatus("Назва пишеться латинськими літерами a-z, можна _ і цифри (але не на початку).");
        }
      });
    } else { // number
      el.classList.add("narrow");
      el.maxLength = def.len || 2;
      el.inputMode = "numeric";
      // Числове поле приймає лише цифри
      el.addEventListener("input", function () {
        var v = this.value;
        var cleaned = v.replace(/[^0-9]/g, "");
        if (cleaned !== v) {
          this.value = cleaned;
          setStatus("Це поле приймає лише цифри.");
        }
      });
    }
  }
  el.dataset.key = def.key;
  // Коли гравець щось змінює — знімаємо підсвічення і повертаємо підказку кроку
  el.addEventListener("input",  function () { this.classList.remove("need"); });
  el.addEventListener("change", function () { this.classList.remove("need"); setStatus(st.statusHint); });
  return el;
}

// Побудувати форму-конструктор кроку
function buildForm(st, myEpoch) {
  var form = document.createElement("form");
  form.className = "construct";
  var line = document.createElement("div");
  line.className = "codeline";

  st.template.forEach(function (tok) {
    if (typeof tok === "string") {
      var s = document.createElement("span");
      s.className = "tok";
      s.textContent = tok;
      line.appendChild(s);
    } else if (tok.nl) {
      var b = document.createElement("div");
      b.className = "brk";
      line.appendChild(b);
    } else {
      line.appendChild(makeField(fieldDef(st, tok.f), st));
    }
  });
  form.appendChild(line);

  var btn = document.createElement("button");
  btn.type = "submit";
  btn.className = "btn";
  btn.textContent = "ВИКОНАТИ ▶";
  form.appendChild(btn);

  form.addEventListener("submit", function (e) {
    e.preventDefault();
    tryExecute(st, form, myEpoch);
  });

  elWork.appendChild(form);
  // Фокус на перше поле — для проходження лише з клавіатури
  var first = form.querySelector("[data-key]");
  if (first) first.focus();
}

/* ================= API ДЛЯ АНІМАЦІЙ УСПІХУ ================= */
function makeApi(myEpoch) {
  return {
    print: function (t, cls) { if (epoch === myEpoch) print(t, cls); },
    scene: function (t)      { if (epoch === myEpoch) setScene(t); },
    status: function (t)     { if (epoch === myEpoch) setStatus(t); },
    pause: sleep,
    okBeep: okBeep,
    clickBeep: clickBeep,
    beep: beep
  };
}

/* ================= ВИКОНАННЯ КРОКУ-КОНСТРУКТОРА ================= */
async function tryExecute(st, form, myEpoch) {
  if (busy || typing || epoch !== myEpoch) return;

  // 1. Збираємо значення; порожні поля — не помилка, а м'яка підказка
  var vals = {};
  var fields = form.querySelectorAll("[data-key]");
  for (var i = 0; i < fields.length; i++) {
    var el = fields[i];
    vals[el.dataset.key] = el.value.trim();
    if (!vals[el.dataset.key]) {
      el.classList.add("need");
      storyHint(fieldDef(st, el.dataset.key).emptyHint);
      el.focus();
      return;
    }
  }

  // 2. Сюжетна перевірка місії
  var res = st.check(vals, game.vars);
  if (!res.ok) {
    // Деякі «неправильні» відповіді мають кумедний сюжетний наслідок-анімацію
    if (res.play) {
      busy = true;
      var tmp = form.querySelectorAll("input, select, button");
      tmp.forEach(function (el) { el.disabled = true; });
      await res.play(makeApi(myEpoch), game.vars);
      busy = false;
      if (epoch !== myEpoch) return;
      tmp.forEach(function (el) { el.disabled = false; });
    }
    storyHint(res.hint);
    if (res.key) {
      var bad = form.querySelector('[data-key="' + res.key + '"]');
      if (bad) { bad.classList.add("need"); bad.focus(); }
    }
    return;
  }

  // 3. Успіх: показуємо справжній синтаксис і граємо анімацію результату
  busy = true;
  form.querySelectorAll("input, select, button").forEach(function (el) { el.disabled = true; });
  print("> " + st.code(vals, game.vars), "exec");
  okBeep();
  setStatus("Виконую…");
  await st.success(vals, makeApi(myEpoch), game.vars);
  busy = false;
  if (epoch === myEpoch) advance();
}

/* ================= КРОК-ВИКЛИК (кнопки функцій) ================= */
function buildCalls(st, myEpoch) {
  var made = 0;
  var btn = document.createElement("button");
  btn.type = "button";
  btn.className = "btn big";
  btn.textContent = st.buttonLabel(game.vars);
  btn.addEventListener("click", async function () {
    if (busy || typing || epoch !== myEpoch) return;
    busy = true;
    btn.disabled = true;
    made++;
    print("> " + st.callCode(game.vars), "exec");
    await st.onCall(made, makeApi(myEpoch), game.vars);
    busy = false;
    if (epoch !== myEpoch) return;
    if (made >= st.total) { advance(); }
    else { btn.disabled = false; btn.focus(); }
  });
  elWork.appendChild(btn);
  btn.focus();
}

/* ================= ПЕРЕБІГ ГРИ ================= */
function resolveVal(x) { return typeof x === "function" ? x(game.vars) : x; }

async function runStep() {
  var myEpoch = ++epoch;
  busy = false;
  var m = MISSIONS[game.mission];
  var st = m.steps[game.step];

  elMission.textContent = "МІСІЯ " + (game.mission + 1) + "/" + MISSIONS.length + " • " + m.title;
  setHelpPage(m.help);
  if (game.mission === 0) elHelp.classList.add("pulse"); // перша місія підсвічує довідник

  if (st.enter) st.enter(game.vars);
  elStory.innerHTML = "";
  elWork.innerHTML = "";
  setScene(resolveVal(st.scene));

  await typeStory(resolveVal(st.story), myEpoch);
  if (epoch !== myEpoch) return;

  if (st.kind === "form") buildForm(st, myEpoch);
  else buildCalls(st, myEpoch);
  setStatus(st.statusHint);
}

// Перехід до наступного кроку / місії / фіналу
function advance() {
  var m = MISSIONS[game.mission];
  if (game.step + 1 < m.steps.length) {
    game.step++;
    runStep();
  } else if (game.mission + 1 < MISSIONS.length) {
    game.mission++;
    game.step = 0;
    runStep();
  } else {
    showFinale();
  }
}

/* ================= ФІНАЛ ================= */
var idleTimer = null;

function armIdleReset() {
  // Режим стенда: 60 с бездіяльності на фіналі — і гра сама повертається на пролог
  clearTimeout(idleTimer);
  idleTimer = setTimeout(resetGame, 60000);
}

  game.state = "finale";
  elMission.textContent = "МІСІЮ ВИКОНАНО • 5/5";

  elWork.innerHTML = "";
  setScene(ART.peremoha);
  armIdleReset();

  var lines = [
    "СТАНЦІЯ «НЕМК» УРЯТОВАНА!",
    "",
    "Дякую тобі, операторе. Без тебе я був лише купкою переляканих мікросхем.",
    "",
    "! ═══ ТИТРИ ═══",
    "! Ти щойно ПРОГРАМУВАВ: змінні • умови • цикли • функції",
    "! Саме з цих цеглинок складаються всі програми світу — від ігор до бортових комп'ютерів.",
    ""
  ].concat(INVITE_TEXT.map(function (t) { return t; }));

  await typeStory(lines, myEpoch);
  if (epoch !== myEpoch) return;

  var btn = document.createElement("button");
  btn.type = "button";
  btn.className = "btn big";
  btn.textContent = "ПОЧАТИ СПОЧАТКУ ↺";
  btn.addEventListener("click", function () { resetGame(); });
  elWork.appendChild(btn);
  btn.focus();
  setStatus("Натисни «ПОЧАТИ СПОЧАТКУ», щоб передати місію наступному оператору");
}

/* ================= ПРОЛОГ / СКИДАННЯ ================= */
function startGame() {
  if (game.state !== "prologue") return;
  ensureAudio();
  okBeep();
  game.state = "play";
  game.mission = 0;
  game.step = 0;
  game.vars = {};
  elPrologue.classList.add("hidden");
  elHelp.classList.remove("open");
  elHelpTgl.setAttribute("aria-expanded", "false");
  runStep();
}

function resetGame() {
  // Повне повернення на пролог (для наступного гостя)
  epoch++;
  clearTimeout(idleTimer);
  busy = false;
  typing = false;
  skipRequested = false;
  game.state = "prologue";
  game.mission = 0;
  game.step = 0;
  game.vars = {};
  elStory.innerHTML = "";
  elWork.innerHTML = "";
  setScene("");
  elMission.textContent = "•";
  setStatus("Очікування сигналу…");
  elHelp.classList.remove("open", "pulse");
  elHelpTgl.setAttribute("aria-expanded", "false");
  elPrologue.classList.remove("hidden");
  $("#prologue-btn").focus();
}

/* ================= ГЛОБАЛЬНІ ПОДІЇ ================= */
elPrologue.addEventListener("click", startGame);
$("#prologue-btn").addEventListener("click", function (e) { e.stopPropagation(); startGame(); });

// Клік по екрану під час друку — миттєво додрукувати
elScreen.addEventListener("click", function () {
  if (typing) skipRequested = true;
});

window.addEventListener("keydown", function (e) {
  // Ctrl+Shift+R — миттєве скидання на пролог (для викладача)
  if (e.ctrlKey && e.shiftKey && e.code === "KeyR") {
    e.preventDefault();
    resetGame();
    return;
  }
  // Enter на пролозі — старт
  if (game.state === "prologue" && (e.key === "Enter" || e.key === " ")) {
    e.preventDefault();
    startGame();
    return;
  }
  // Enter/пробіл під час друку — пропустити анімацію тексту
  if (typing && (e.key === "Enter" || e.key === " ")) {
    e.preventDefault();
    skipRequested = true;
  }
});

// Будь-яка активність на фіналі відкладає автоскидання
["keydown", "mousedown", "mousemove"].forEach(function (ev) {
  window.addEventListener(ev, function () {
    if (game.state === "finale") armIdleReset();
  });
});

/* ================= СТАРТ ================= */
$("#prologue-btn").focus();
</script>
</body>
</html>
