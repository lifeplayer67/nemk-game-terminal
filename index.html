<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Станція «НЕФК» — навчальний термінал</title>
<style>
/* ============================================================
   СТАНЦІЯ «НЕФК» — ретро-CRT термінал (v2)
   Один самодостатній файл. Без зовнішніх ресурсів.
   ============================================================ */
* { margin: 0; padding: 0; box-sizing: border-box; }

:root {
  --green:  #35ff6d;   /* основний фосфорний */
  --green-dim: #1d8f47;
  --green-dark: #0a3418;
  --amber:  #ffb347;   /* попередження / підказки */
  --red:    #ff5a5a;   /* тривога */
  --bg:     #030803;
}

html, body { height: 100%; }

body {
  background: var(--bg);
  color: var(--green);
  font-family: "Cascadia Mono", Consolas, Menlo, "Liberation Mono", "Courier New", monospace;
  font-size: 18px;
  line-height: 1.45;
  overflow: hidden;
  text-shadow: 0 0 5px rgba(53, 255, 109, 0.45);
}

/* ---------- CRT-ефекти: скан-лінії, віньєтка, мерехтіння ---------- */
#crt-overlay {
  position: fixed; inset: 0;
  pointer-events: none;
  z-index: 90;
  background: repeating-linear-gradient(
    to bottom,
    transparent 0px, transparent 2px,
    rgba(0, 0, 0, 0.16) 2px, rgba(0, 0, 0, 0.16) 4px
  );
  animation: flicker 4s infinite;
}
#crt-vignette {
  position: fixed; inset: 0;
  pointer-events: none;
  z-index: 91;
  background: radial-gradient(ellipse at center,
    transparent 55%, rgba(0, 0, 0, 0.42) 100%);
}
@keyframes flicker {
  0%, 100% { opacity: 1; }
  92%      { opacity: 1; }
  93%      { opacity: 0.86; }
  94%      { opacity: 1; }
  97%      { opacity: 0.93; }
}

/* ---------- Каркас екрана ---------- */
#app {
  height: 100vh;
  display: grid;
  grid-template-rows: auto 1fr auto;
}

header {
  display: flex;
  align-items: center;
  gap: 18px;
  padding: 8px 16px;
  border-bottom: 1px solid var(--green-dim);
  font-size: 16px;
  letter-spacing: 1px;
  white-space: nowrap;
}
header .title { font-weight: bold; }
header .spacer { flex: 1; }
#link-ind { color: var(--green-dim); animation: softblink 2.2s infinite; }
@keyframes softblink { 0%,100% { opacity: 1; } 50% { opacity: 0.45; } }

#main {
  display: flex;
  min-height: 0;
}

/* ---------- Головний екран термінала ---------- */
#screen {
  flex: 1;
  min-width: 0;
  overflow-y: auto;
  padding: 18px 24px 28px;
  scrollbar-width: thin;
  scrollbar-color: var(--green-dim) var(--bg);
}
#screen::-webkit-scrollbar { width: 8px; }
#screen::-webkit-scrollbar-thumb { background: var(--green-dark); }

#scene {
  color: var(--green-dim);
  text-shadow: 0 0 4px rgba(53, 255, 109, 0.3);
  font-size: 15px;
  line-height: 1.25;
  margin-bottom: 14px;
  white-space: pre;
  overflow-x: auto;
  /* сцена «прилипає» до верху екрана, щоб анімації завжди було видно */
  position: sticky;
  top: -18px;
  z-index: 2;
  background: var(--bg);
  border-bottom: 1px solid var(--green-dark);
  padding: 6px 0 10px;
}

#story .line { min-height: 1.45em; margin-bottom: 2px; white-space: pre-wrap; }
.line.warn  { color: var(--amber); text-shadow: 0 0 5px rgba(255, 179, 71, 0.4); }
.line.alert { color: var(--red);   text-shadow: 0 0 5px rgba(255, 90, 90, 0.4); }
.line.ok    { color: #9dffbe; }
.line.exec  {
  color: #c8ffdc;
  background: rgba(53, 255, 109, 0.07);
  border-left: 3px solid var(--green-dim);
  padding: 2px 8px;
  margin: 6px 0;
}
.line.dim   { color: var(--green-dim); }

/* ---------- Конструктор коду ---------- */
#workarea { margin-top: 14px; }

form.construct {
  border: 1px dashed var(--green-dim);
  padding: 14px 16px;
  max-width: 760px;
}
.codeline {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 6px;
  font-size: 20px;
  margin-bottom: 6px;
}
.codeline .tok { white-space: pre; }
.codeline .brk { width: 100%; height: 6px; }

input.fld, select.fld {
  background: #041505;
  color: var(--green);
  border: 1px solid var(--green-dim);
  font: inherit;
  font-size: 19px;
  padding: 3px 8px;
  text-shadow: inherit;
}
input.fld { width: 9ch; }
input.fld.narrow { width: 5ch; text-align: center; }
input.fld.call { width: 16ch; }
select.fld { cursor: pointer; }
select.fld option { background: #041505; color: var(--green); }

input.fld:focus-visible, select.fld:focus-visible,
button:focus-visible, a:focus-visible {
  outline: 2px solid var(--amber);
  outline-offset: 2px;
}

/* м'яке підсвічення незаповненого поля — без «помилок» */
.fld.need {
  border-color: var(--amber);
  animation: needpulse 0.9s infinite;
}
@keyframes needpulse {
  0%, 100% { box-shadow: 0 0 0 0 rgba(255, 179, 71, 0); }
  50%      { box-shadow: 0 0 10px 2px rgba(255, 179, 71, 0.45); }
}

button.btn {
  background: transparent;
  color: var(--green);
  border: 1px solid var(--green);
  font: inherit;
  font-size: 19px;
  padding: 7px 22px;
  margin-top: 10px;
  cursor: pointer;
  text-shadow: inherit;
  letter-spacing: 1px;
}
button.btn:hover:not(:disabled) { background: var(--green-dark); }
button.btn:disabled { opacity: 0.4; cursor: default; }
button.btn.big { font-size: 22px; padding: 12px 34px; }

/* ---------- Довідник (панель праворуч) ---------- */
#help {
  display: flex;
  border-left: 1px solid var(--green-dim);
  background: rgba(3, 20, 6, 0.6);
}
#help-toggle {
  background: transparent;
  border: none;
  color: var(--amber);
  font: inherit;
  font-size: 16px;
  cursor: pointer;
  padding: 14px 10px;
  writing-mode: vertical-rl;
  text-orientation: mixed;
  letter-spacing: 3px;
  animation: softblink 1.8s infinite;
  text-shadow: 0 0 5px rgba(255, 179, 71, 0.4);
}
#help.open #help-toggle { animation: none; }
#help.pulse #help-toggle { animation: softblink 0.7s infinite; }
#help-body {
  display: none;
  width: 340px;
  padding: 16px 18px;
  overflow-y: auto;
  font-size: 16px;
}
#help.open #help-body { display: block; }
#help-body h3 {
  color: var(--amber);
  font-size: 17px;
  margin-bottom: 10px;
  letter-spacing: 1px;
}
#help-body p { margin-bottom: 10px; }
#help-body pre {
  background: #041505;
  border: 1px solid var(--green-dark);
  padding: 8px 10px;
  margin: 10px 0;
  font-size: 15px;
  white-space: pre-wrap;
  color: #c8ffdc;
}
#help-body .analogy {
  border-left: 3px solid var(--amber);
  padding: 6px 10px;
  color: var(--amber);
  margin-top: 12px;
  font-size: 15px;
}

/* ---------- Рядок стану ---------- */
#statusbar {
  border-top: 1px solid var(--green-dim);
  padding: 8px 16px;
  font-size: 16px;
  min-height: 38px;
  color: var(--amber);
  text-shadow: 0 0 5px rgba(255, 179, 71, 0.35);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
#statusbar::before { content: "▸ "; }

/* ---------- Пролог: «зламаний» екран ---------- */
#prologue {
  position: fixed; inset: 0;
  z-index: 80;
  background: var(--bg);
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 26px;
  cursor: pointer;
}
#prologue .noise {
  position: absolute; inset: 0;
  background: repeating-linear-gradient(
    to bottom,
    transparent 0 26px,
    rgba(53, 255, 109, 0.05) 26px 29px,
    transparent 29px 61px,
    rgba(255, 90, 90, 0.04) 61px 63px
  );
  animation: noise-roll 1.1s linear infinite;
  pointer-events: none;
}
@keyframes noise-roll {
  from { background-position-y: 0; }
  to   { background-position-y: 63px; }
}
#prologue pre.glitch {
  color: var(--red);
  font-size: 17px;
  text-shadow: 0 0 8px rgba(255, 90, 90, 0.6);
  animation: glitch-jerk 2.7s infinite;
  white-space: pre;
}
@keyframes glitch-jerk {
  0%, 100% { transform: translateX(0) skewX(0deg); opacity: 1; }
  8%   { transform: translateX(3px)  skewX(2deg); }
  9%   { transform: translateX(-4px) skewX(-3deg); opacity: 0.7; }
  10%  { transform: translateX(0); opacity: 1; }
  46%  { transform: translateX(-2px); }
  47%  { transform: translateX(2px) skewX(1deg); opacity: 0.8; }
  48%  { transform: translateX(0); opacity: 1; }
}
#prologue-btn {
  background: transparent;
  border: 1px dashed var(--red);
  color: var(--red);
  font: inherit;
  font-size: 21px;
  padding: 14px 26px;
  cursor: pointer;
  animation: softblink 1s infinite;
  text-shadow: 0 0 8px rgba(255, 90, 90, 0.6);
}

/* ---------- Екран живлення (одноразовий, для викладача) ---------- */
/* Браузер дозволяє requestFullscreen лише у відповідь на дію користувача,
   тому потрібен один клік/Enter перед грою. Показується тільки при
   завантаженні сторінки; скидання гри сюди не повертають. */
#powergate {
  position: fixed; inset: 0;
  z-index: 90;
  background: #000;
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
}
#powergate-btn {
  background: transparent;
  border: 1px solid rgba(53, 255, 109, 0.35);
  color: rgba(53, 255, 109, 0.55);
  font: inherit;
  font-size: 16px;
  padding: 10px 22px;
  cursor: pointer;
  animation: softblink 2.2s infinite;
}

.hidden { display: none !important; }

@media (max-width: 1440px) {
  #help-body { width: 300px; }
}
</style>
</head>
<body>

<!-- CRT-накладки: скан-лінії та віньєтка -->
<div id="crt-overlay"></div>
<div id="crt-vignette"></div>

<!-- Екран живлення: викладач один раз вмикає термінал (і фулскрін) -->
<div id="powergate">
  <button id="powergate-btn">[ УВІМКНУТИ ЖИВЛЕННЯ ТЕРМІНАЛА ]</button>
</div>

<!-- Пролог: «зламаний» екран із SOS (текст задає сценарій) -->
<div id="prologue">
  <div class="noise"></div>
  <pre class="glitch" id="prologue-art"></pre>
  <button id="prologue-btn"></button>
</div>

<!-- Основний каркас -->
<div id="app">
  <header>
    <span class="title" id="station-title">СТАНЦІЯ «НЕФК»</span>
    <span id="mission-ind">•</span>
    <span class="spacer"></span>
    <span id="link-ind">ЗВ'ЯЗОК: ОК</span>
    <button id="snd-btn" class="btn" style="margin:0; font-size:15px; padding:4px 10px;">ЗВУК: УВІМК</button>
  </header>

  <div id="main">
    <main id="screen">
      <pre id="scene"></pre>
      <div id="story"></div>
      <div id="workarea"></div>
    </main>

    <aside id="help">
      <button id="help-toggle" aria-expanded="false" aria-controls="help-body">[?] ДОВІДНИК</button>
      <div id="help-body"></div>
    </aside>
  </div>

  <div id="statusbar">Очікування сигналу…</div>
</div>

<script>
"use strict";
/* ============================================================
   «НЕФК» — рушій гри (v2)

   АРХІТЕКТУРА ДЛЯ ВИКЛАДАЧА:
   - МЕХАНІКИ 5 місій (поля, перевірки, анімації) — у функції
     makeMissions(S). Вони однакові для всіх сценаріїв.
   - СЮЖЕТ (тексти, назви, ASCII-арт, підказки) — у масиві
     SCENARIOS. Щоб додати нову історію, скопіюйте будь-який
     сценарій, замініть тексти й арт — механіки підхопляться самі.
   - Довідник (навчальні сторінки) — у HELP, спільний для всіх.
   - Запрошення коледжу — у константі INVITE_TEXT.

   ПАРАМЕТРИ URL:
   - ?station=N — номер станції: показується в шапці й текстах
     («НЕФК-N») і визначає сценарій (по колу). Без параметра —
     випадковий сценарій на кожному запуску/скиданні.
   - ?hints=1 — показувати підказки-плейсхолдери у полях вводу
     (типово hints=0, плейсхолдери приховані).
   ============================================================ */

/* ----------- ТЕКСТ-ПЛЕЙСХОЛДЕР ЗАПРОШЕННЯ (легко замінити) ----------- */
var INVITE_TEXT = [
  "Сподобалося керувати станцією?",
  "Приходь навчатися до нашого коледжу — і навчишся створювати",
  "такі програми по-справжньому!",
  "[ Тут — текст запрошення коледжу: спеціальності, контакти, сайт ]"
];

/* ================= ПАРАМЕТРИ URL ================= */
var QS = new URLSearchParams(window.location.search);
// плейсхолдери показуються лише при явному hints=1 (типово приховані)
var SHOW_PH = QS.get("hints") === "1";
// station=N — номер станції (може бути відсутній)
var STATION_NUM = (function () {
  var n = parseInt(QS.get("station"), 10);
  return isNaN(n) ? null : n;
})();

/* ================= КОРОТКІ ПОСИЛАННЯ НА DOM ================= */
var $ = function (sel) { return document.querySelector(sel); };
var elScreen   = $("#screen");
var elScene    = $("#scene");
var elStory    = $("#story");
var elWork     = $("#workarea");
var elStatus   = $("#statusbar");
var elMission  = $("#mission-ind");
var elPrologue = $("#prologue");
var elHelp     = $("#help");
var elHelpBody = $("#help-body");
var elHelpTgl  = $("#help-toggle");

/* ================= СТАН ГРИ ================= */
var game = {
  state: "prologue",   // prologue | play | finale
  mission: 0,          // індекс поточної місії
  step: 0,             // індекс кроку всередині місії
  vars: {}             // спільні дані між кроками (назва функції, сила залпу тощо)
};
var epoch = 0;         // «покоління» екрана: захищає від застарілих анімацій після скидання
var busy  = false;     // true під час анімації успіху — блокує повторний ВИКОНАТИ

var scenario = null;       // поточний сценарій (сюжетний шар)
var MISSIONS = [];         // місії, згенеровані makeMissions(scenario)
var stationLabel = "НЕФК"; // ім'я станції з номером, підставляється замість %ST%

// Підстановка імені станції в текстах сценарію
function T(s) { return String(s).split("%ST%").join(stationLabel); }

/* ================= ЗВУК (Web Audio, без файлів) ================= */
var audioCtx = null;
var soundOn = true;

function ensureAudio() {
  // Створюємо аудіоконтекст лише після жесту користувача (вимога браузерів)
  if (!audioCtx) {
    try {
      audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    } catch (e) { soundOn = false; }
  }
  if (audioCtx && audioCtx.state === "suspended") { audioCtx.resume(); }
}

function beep(freq, dur, vol, type) {
  if (!soundOn || !audioCtx) return;
  try {
    var o = audioCtx.createOscillator();
    var g = audioCtx.createGain();
    o.type = type || "square";
    o.frequency.value = freq;
    g.gain.setValueAtTime(vol, audioCtx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + dur);
    o.connect(g); g.connect(audioCtx.destination);
    o.start();
    o.stop(audioCtx.currentTime + dur);
  } catch (e) { /* звук — не критична функція */ }
}
function clickBeep() { beep(1100, 0.012, 0.02); }
function okBeep()    { beep(660, 0.09, 0.06); setTimeout(function () { beep(990, 0.14, 0.06); }, 100); }
function warnBeep()  { beep(240, 0.16, 0.06, "sawtooth"); }

/* ================= ОПЦІЙНА МУЗИКА ІНТРО ================= */
// Якщо ПОРУЧ з index.html лежить файл intro.mp3 — він грає на пролозі
// (старт після кліку по екрану живлення, зациклено, плавне згасання
// при старті гри). Файла немає — повна тиша, помилка глушиться.
// Сам файл у репозиторій не додається (див. .gitignore).
var introMusic = null;
(function () {
  try {
    var a = new Audio("intro.mp3");
    a.loop = true;
    a.volume = 0.4;
    a.addEventListener("error", function () { introMusic = null; });
    introMusic = a;
  } catch (e) { introMusic = null; }
})();

function playIntroMusic() {
  if (!introMusic || !soundOn) return;
  try {
    introMusic.volume = 0.4;
    var p = introMusic.play();
    if (p && p.catch) p.catch(function () { /* автоплей заборонено — тиша */ });
  } catch (e) { /* музика — не критична функція */ }
}

function stopIntroMusic() {
  if (!introMusic) return;
  var a = introMusic;
  try {
    // плавне згасання, потім пауза і повернення гучності для наступного разу
    var iv = setInterval(function () {
      a.volume = Math.max(0, a.volume - 0.05);
      if (a.volume <= 0.01) {
        clearInterval(iv);
        a.pause();
        a.currentTime = 0;
        a.volume = 0.4;
      }
    }, 60);
  } catch (e) { try { a.pause(); } catch (e2) {} }
}

$("#snd-btn").addEventListener("click", function () {
  soundOn = !soundOn;
  if (soundOn) {
    ensureAudio();
    // якщо ми на пролозі (і живлення вже ввімкнено) — повернути музику
    if (game.state === "prologue" && !elGate) playIntroMusic();
  } else if (introMusic) {
    try { introMusic.pause(); } catch (e) {}
  }
  this.textContent = soundOn ? "ЗВУК: УВІМК" : "ЗВУК: ВИМК";
});

/* ================= ДРУКАРСЬКА МАШИНКА ================= */
var typing = false;        // чи йде зараз посимвольний друк
var skipRequested = false; // Enter/клік — додрукувати миттєво

function sleep(ms) { return new Promise(function (r) { setTimeout(r, ms); }); }
function scrollDown() { elScreen.scrollTop = elScreen.scrollHeight; }

// Додати готовий рядок миттєво (для анімацій результату)
function print(text, cls) {
  var el = document.createElement("div");
  el.className = "line" + (cls ? " " + cls : "");
  el.textContent = T(text);
  elStory.appendChild(el);
  scrollDown();
  return el;
}

// Надрукувати один рядок посимвольно
async function typeLine(text, cls, myEpoch) {
  var el = document.createElement("div");
  el.className = "line" + (cls ? " " + cls : "");
  elStory.appendChild(el);
  for (var i = 0; i < text.length; i++) {
    if (epoch !== myEpoch) return;           // екран скинуто — тихо виходимо
    if (skipRequested) break;                // гравець просить одразу весь текст
    el.textContent += text[i];
    if (i % 3 === 0) clickBeep();
    scrollDown();
    await sleep(21); // темп друку (сповільнено в 1,5 раза за v4)
  }
  if (epoch === myEpoch) { el.textContent = text; scrollDown(); }
}

// Надрукувати блок сюжету; рядки можуть мати префікси стилю:
//   "!! " — тривога (червоний), "! " — попередження (бурштин), ". " — тьмяний
async function typeStory(lines, myEpoch) {
  skipRequested = false;
  typing = true;
  setStatus("Йде передача даних… (ENTER — показати одразу)");
  for (var i = 0; i < lines.length; i++) {
    if (epoch !== myEpoch) { typing = false; return; }
    var text = T(lines[i]), cls = "";
    if (text.indexOf("!! ") === 0)     { cls = "alert"; text = text.slice(3); }
    else if (text.indexOf("! ") === 0) { cls = "warn";  text = text.slice(2); }
    else if (text.indexOf(". ") === 0) { cls = "dim";   text = text.slice(2); }
    if (skipRequested) { print(text, cls); }
    else {
      await typeLine(text, cls, myEpoch);
      await sleep(135); // пауза між рядками (сповільнено в 1,5 раза за v4)
    }
  }
  typing = false;
}

/* ================= РЯДОК СТАНУ ТА ПІДКАЗКИ ================= */

/* ================= СПІЛЬНІ ХУДОЖНІ ПОМІЧНИКИ ================= */
function rep(s, n) { return new Array(Math.max(0, n) + 1).join(s); }

// Ряд юнітів (роботи/краби/ґолеми) під базовою сценою — успіх місії 1
function artUnits(S, n) {
  var shown = Math.min(n, 8);
  var r1 = "", r2 = "";
  for (var i = 0; i < shown; i++) { r1 += " " + S.unit.face + " "; r2 += " " + S.unit.legs + " "; }
  var extra = n > shown ? ("   … і ще " + (n - shown) + " у другому ряду") : "";
  return S.baseArt + "\n\n" + r1 + extra + "\n" + r2;
}

// Датчик місії 2: назва сенсора, значення, смужка-індикатор
function artMeter(S, val) {
  var bars = Math.max(0, Math.min(10, Math.round(val / 10)));
  var bar = "[" + rep("▓", bars) + rep("░", 10 - bars) + "]";
  return "   " + S.m2.sceneTitle + ":  " + S.m2.sensor + " = " + val + "   " + bar +
         "\n\n" + S.baseArt;
}

// Сітка місії 3: 8 секцій, лічильник і ОДИН ремонтний юніт.
// fixed — число полагоджених підряд АБО масив із 8 булевих значень;
// pos   — секція, під якою стоїть юніт (0 — у доку, 9 — «шукає неіснуючу»)
function artGrid(S, fixed, pos) {
  var G = S.m3.grid;
  var arr = (fixed instanceof Array) ? fixed : null;
  var cells = "", done = 0;
  for (var i = 0; i < 8; i++) {
    var ok = arr ? arr[i] : (i < fixed);
    if (ok) done++;
    cells += ok ? "[▓]" : "[X]";
  }
  var out = [
    "   " + G.counter + ": залишилось " + (8 - done) + " з 8",
    "",
    "   " + cells + "      [X] — " + G.bad + "   [▓] — " + G.ok
  ];
  if (pos >= 1) {
    var center = 3 + (Math.min(pos, 9) - 1) * 3 + 1; // колонка секції, де стоїть юніт
    out.push(rep(" ", center) + "▲");
    out.push(rep(" ", Math.max(0, center - 2)) + S.unit.face + "  ← " + G.unitLabel);
  } else {
    out.push("");
    out.push("   " + S.unit.face + "  ← " + G.unitLabel);
  }
  return out.join("\n");
}

/* ============================================================
   МЕХАНІКИ МІСІЙ (однакові для всіх сценаріїв)
   makeMissions(S) будує 5 місій із сюжетного шару S.
   Кожен крок:
   - kind:"form" — конструктор коду (template + fields + check +
     code + success); check може повернути play — кумедну
     анімацію-наслідок перед підказкою;
   - kind:"call" — ручний виклик функції (гравець сам друкує
     назву з дужками), total — скільки викликів потрібно.
   ============================================================ */
function makeMissions(S) {
  return [

    /* ---------- МІСІЯ 1: ЗМІННА ---------- */
    {
      title: S.m1.title,
      help: "zminna",
      steps: [{
        kind: "form",
        scene: S.baseArt,
        story: S.m1.story,
        template: [
          "const ", { f: "name" }, ": ", { f: "typ" }, " = ", { f: "num" }, ";"
        ],
        fields: [
          { key: "name", kind: "name", placeholder: S.m1.namePh, emptyHint: S.m1.hEmptyName },
          { key: "typ",  kind: "select", options: TYP_OPTS, emptyHint: S.m1.hEmptyTyp },
          { key: "num",  kind: "adaptive", len: 2, phNum: "0", phText: "bagato",
            emptyHint: function (v) {
              if (v.typ === "takni") return "Обери значення: «так» чи «ні» — саме такі значення зберігає тип «істинність».";
              if (v.typ === "tekst") return "Впиши будь-який текст — побачиш, які значення зберігає тип «текст».";
              return S.m1.hEmptyNum;
            } }
        ],
        statusHint: S.m1.status,
        check: function (v) {
          if (v.typ === "tekst") return { ok: false, key: "typ", hint: S.m1.hTekst };
          if (v.typ === "takni") return { ok: false, key: "typ", hint: S.m1.hTakni };
          if (parseInt(v.num, 10) < 1) return { ok: false, key: "num", hint: S.m1.hZero };
          return { ok: true };
        },
        code: function (v) { return "const " + v.name + ": number = " + parseInt(v.num, 10) + ";"; },
        success: async function (v, api) {
          var n = parseInt(v.num, 10);
          api.print(S.m1.sSaved.replace("%NAME%", v.name).replace("%N%", n), "ok");
          await api.pause(500);
          api.print(S.m1.sMuster);
          await api.pause(500);
          api.scene(artUnits(S, n));
          api.okBeep();
          await api.pause(700);
          api.print(S.m1.sDone.replace("%N%", n), "ok");
          await api.pause(1100);
        }
      }]
    },

    /* ---------- МІСІЯ 2: УМОВА if ---------- */
    {
      title: S.m2.title,
      help: "umova",
      steps: [{
        kind: "form",
        enter: function (g) {
          // випадкове значення датчика 12..48 — щоб правило точно спрацювало
          g.sensorVal = 12 + Math.floor(Math.random() * 37);
        },
        scene: function (g) { return artMeter(S, g.sensorVal); },
        story: function (g) { return S.m2.story(g.sensorVal); },
        template: [
          "if (" + S.m2.sensor + " ", { f: "op" }, " ", { f: "num" }, ") {",
          { nl: 1 }, "    ", { f: "act" }, ";",
          { nl: 1 }, "}"
        ],
        fields: [
          { key: "op",  kind: "select", options: OP_OPTS, emptyHint: S.m2.hEmptyOp },
          { key: "num", kind: "number", len: 2, placeholder: "0", emptyHint: S.m2.hEmptyNum },
          { key: "act", kind: "select", options: S.m2.actOpts, emptyHint: S.m2.hEmptyAct }
        ],
        statusHint: S.m2.status,
        check: function (v) {
          if (v.op === ">")  return { ok: false, key: "op", hint: S.m2.hOpMore };
          if (v.op === "==") return { ok: false, key: "op", hint: S.m2.hOpEq };
          if (parseInt(v.num, 10) !== 50) return { ok: false, key: "num", hint: S.m2.hNum };
          if (v.act !== S.m2.correctAct)
            return { ok: false, key: "act", hint: S.m2.actHints[v.act] };
          return { ok: true };
        },
        code: function () { return "if (" + S.m2.sensor + " < 50) {\n    " + S.m2.actCode + "();\n}"; },
        success: async function (v, api, g) {
          api.print(S.m2.sRule);
          await api.pause(600);
          api.print(S.m2.sTrue.split("%V%").join(g.sensorVal), "ok");
          await api.pause(600);
          api.print(S.m2.sOn, "ok");
          api.okBeep();
          api.scene(artMeter(S, 100));
          await api.pause(700);
          api.print(S.m2.sDone, "ok");
          await api.pause(1100);
        }
      }]
    },

    /* ---------- МІСІЯ 3: ЦИКЛ for ---------- */
    {
      title: S.m3.title,
      help: "tsykl",
      steps: [{
        kind: "form",
        scene: artGrid(S, 0, 0),
        story: S.m3.story,
        // тіло циклу — з нового рядка з відступом, як у справжньому коді
        template: [
          "for (крок від ", { f: "a" }, " до ", { f: "b" }, ") {",
          { nl: 1 }, "    ", { f: "cmd" }, ";",
          { nl: 1 }, "}"
        ],
        fields: [
          { key: "a", kind: "number", len: 2, placeholder: "0", emptyHint: S.m3.hEmptyA },
          { key: "b", kind: "number", len: 2, placeholder: "0", emptyHint: S.m3.hEmptyB },
          { key: "cmd", kind: "select", options: S.m3.cmdOpts, emptyHint: S.m3.hEmptyCmd }
        ],
        statusHint: S.m3.status,
        check: function (v) {
          var a = parseInt(v.a, 10), b = parseInt(v.b, 10);
          if (v.cmd === "wrong")
            return { ok: false, key: "cmd", hint: S.m3.hCmdWrong };
          if (a === 0 || b === 0)
            return { ok: false, key: (a === 0 ? "a" : "b"), hint: S.m3.hZeroSec };
          if (a > b)
            return { ok: false, key: "a", hint: S.m3.hBackward.replace("%A%", a).replace("%B%", b) };
          if (b > 8)
            return {
              ok: false, key: "b", hint: S.m3.hOver,
              // кумедний наслідок: юніт «зависає» на неіснуючій секції
              play: async function (api) {
                api.scene(artGrid(S, 0, 9));
                api.print(S.m3.hangLines[0].split("%B%").join(b));
                await api.pause(600);
                api.print(S.m3.hangLines[1].split("%B%").join(b), "warn");
                await api.pause(700);
                api.print(S.m3.hangLines[2]);
                await api.pause(400);
                api.scene(artGrid(S, 0, 0));
              }
            };
          if (a > 1 || b < 8) {
            var left = 8 - (b - a + 1);
            return {
              ok: false, key: (a > 1 ? "a" : "b"),
              hint: S.m3.hPartial.replace("%A%", a).replace("%B%", b).replace("%LEFT%", left),
              // кумедний наслідок: юніт лагодить лише вибрані секції
              play: async function (api) {
                var done = [false, false, false, false, false, false, false, false];
                for (var i = a; i <= b; i++) {
                  done[i - 1] = true;
                  api.scene(artGrid(S, done.slice(), i));
                  api.print(S.m3.sPartialStep.split("%I%").join(i));
                  api.clickBeep();
                  await api.pause(300);
                }
                await api.pause(400);
                api.print(S.m3.partialFreeze, "warn");
                await api.pause(500);
                api.scene(artGrid(S, 0, 0));
                api.print(S.m3.partialUndo);
                await api.pause(300);
              }
            };
          }
          return { ok: true };
        },
        code: function () {
          return "for (let krok = 1; krok <= 8; krok++) {\n    " + S.m3.cmdCode + "();\n}";
        },
        success: async function (v, api) {
          api.print(S.m3.sStart);
          await api.pause(500);
          for (var i = 1; i <= 8; i++) {
            api.scene(artGrid(S, i, i));
            api.print(S.m3.sStep.split("%I%").join(i), i === 8 ? "ok" : "");
            api.clickBeep();
            await api.pause(300);
          }
          api.okBeep();
          api.print(S.m3.sDone, "ok");
          await api.pause(1100);
        }
      }]
    },

    /* ---------- МІСІЯ 4: ФУНКЦІЯ ---------- */
    {
      title: S.m4.title,
      help: "funktsiya",
      steps: [
        /* Крок А — оголошення функції (тіло — з нового рядка з відступом) */
        {
          kind: "form",
          scene: S.atakaArt(3),
          story: S.m4.storyA,
          template: [
            "function ", { f: "name" }, "() {",
            { nl: 1 }, "    ", { f: "d1" }, ";",
            { nl: 1 }, "    ", { f: "d2" }, ";",
            { nl: 1 }, "}"
          ],
          fields: [
            { key: "name", kind: "name", placeholder: S.m4.namePh, emptyHint: S.m4.hEmptyName },
            { key: "d1", kind: "select", options: S.m4.actOpts, emptyHint: S.m4.hEmptyD1 },
            { key: "d2", kind: "select", options: S.m4.actOpts, emptyHint: S.m4.hEmptyD2 }
          ],
          statusHint: S.m4.statusA,
          check: function (v) {
            if (v.d1 === "silly" || v.d2 === "silly")
              return { ok: false, key: (v.d1 === "silly" ? "d1" : "d2"), hint: S.m4.hSilly };
            if (v.d1 === "second" && v.d2 === "first")
              return { ok: false, key: "d1", hint: S.m4.hReversed };
            if (v.d1 === v.d2)
              return { ok: false, key: "d2", hint: S.m4.hSame };
            return { ok: true };
          },
          code: function (v) {
            return "function " + v.name + "() {\n    " + S.m4.code1 + "();\n    " + S.m4.code2 + "();\n}";
          },
          success: async function (v, api, g) {
            g.protoName = v.name; // запам'ятовуємо назву для кроку виклику
            api.print(S.m4.sProto.replace("%NAME%", v.name), "ok");
            api.okBeep();
            await api.pause(600);
            api.print(S.m4.sTeaser);
            await api.pause(900);
          }
        },
        /* Крок Б — ТРИ ручні виклики функції */
        {
          kind: "call",
          total: 3,
          scene: function () { return S.atakaArt(3); },
          story: function (g) { return S.m4.storyB(g.protoName); },
          fname: function (g) { return g.protoName; },
          statusHint: S.m4.statusB,
          onCall: async function (i, api, g) {
            api.print(S.m4.callLine1);
            await api.pause(420);
            api.print(S.m4.callLine2);
            await api.pause(420);
            api.scene(S.atakaArt(3 - i));
            api.print(S.m4.sWave.split("%I%").join(i), "ok");
            api.okBeep();
            await api.pause(500);
            if (i < 3) {
              api.print("");
              api.print(S.m4.nextWave.split("%I%").join(i + 1), "warn");
              api.status(S.m4.statusNext.split("%I%").join(i + 1).split("%F%").join(g.protoName));
            } else {
              api.print(S.m4.sAllWaves.split("%F%").join(g.protoName), "ok");
              await api.pause(1100);
            }
          }
        }
      ]
    },

    /* ---------- МІСІЯ 5: ФІНАЛ «ВСЕ РАЗОМ» ---------- */
    {
      title: "ВСЕ РАЗОМ",
      help: "final",
      steps: [
        /* Крок 1 — змінна: сила пострілу */
        {
          kind: "form",
          scene: S.bossArt,
          story: S.m5.s1.story,
          template: [
            "const " + S.m5.s1.varName + ": ", { f: "typ" }, " = ", { f: "num" }, ";"
          ],
          fields: [
            { key: "typ", kind: "select", options: TYP_OPTS, emptyHint: S.m5.s1.hEmptyTyp },
            { key: "num", kind: "adaptive", len: 2, phNum: "0", phText: "sylno",
              emptyHint: function (v) {
                if (v.typ === "takni") return "Обери значення: «так» чи «ні» — саме такі значення зберігає тип «істинність».";
                if (v.typ === "tekst") return "Впиши будь-який текст — побачиш, які значення зберігає тип «текст».";
                return S.m5.s1.hEmptyNum;
              } }
          ],
          statusHint: S.m5.s1.status,
          check: function (v) {
            if (v.typ === "tekst") return { ok: false, key: "typ", hint: S.m5.s1.hTekst };
            if (v.typ === "takni") return { ok: false, key: "typ", hint: S.m5.s1.hTakni };
            var n = parseInt(v.num, 10);
            if (n < 70) return { ok: false, key: "num", hint: S.m5.s1.hWeak.replace("%N%", n) };
            return { ok: true };
          },
          code: function (v) {
            return "const " + S.m5.s1.varName + ": number = " + parseInt(v.num, 10) + ";";
          },
          success: async function (v, api, g) {
            g.power = parseInt(v.num, 10);
            api.print(S.m5.s1.sSet.replace("%N%", g.power), "ok");
            api.okBeep();
            await api.pause(900);
          }
        },
        /* Крок 2 — цикл: 3 повтори (тіло з нового рядка з відступом) */
        {
          kind: "form",
          scene: S.bossArt,
          story: S.m5.s2.story,
          template: [
            "for (крок від ", { f: "a" }, " до ", { f: "b" }, ") {",
            { nl: 1 }, "    ", { f: "cmd" }, ";",
            { nl: 1 }, "}"
          ],
          fields: [
            { key: "a", kind: "number", len: 2, placeholder: "0", emptyHint: S.m5.s2.hEmptyA },
            { key: "b", kind: "number", len: 2, placeholder: "0", emptyHint: S.m5.s2.hEmptyB },
            { key: "cmd", kind: "select", options: S.m5.s2.cmdOpts, emptyHint: S.m5.s2.hEmptyCmd }
          ],
          statusHint: S.m5.s2.status,
          check: function (v) {
            var a = parseInt(v.a, 10), b = parseInt(v.b, 10);
            if (v.cmd === "wrong1") return { ok: false, key: "cmd", hint: S.m5.s2.hWrong1 };
            if (v.cmd === "wrong2") return { ok: false, key: "cmd", hint: S.m5.s2.hWrong2 };
            if (a === 0 || b === 0)
              return { ok: false, key: (a === 0 ? "a" : "b"), hint: S.m5.s2.hZero };
            if (a > b)
              return { ok: false, key: "a", hint: S.m5.s2.hBackward.replace("%A%", a).replace("%B%", b) };
            if (b > 3)
              return { ok: false, key: "b", hint: S.m5.s2.hOver };
            if (a > 1 || b < 3)
              return { ok: false, key: (a > 1 ? "a" : "b"), hint: S.m5.s2.hPartial.replace("%DONE%", b - a + 1) };
            return { ok: true };
          },
          code: function () {
            return "for (let krok = 1; krok <= 3; krok++) {\n    " + S.m5.s2.cmdCode + "();\n}";
          },
          success: async function (v, api) {
            for (var i = 1; i <= 3; i++) {
              api.print(S.m5.s2.sCharge.split("%I%").join(i));
              api.clickBeep();
              await api.pause(430);
            }
            api.print(S.m5.s2.sDone, "ok");
            api.okBeep();
            await api.pause(900);
          }
        },
        /* Крок 3 — ручний виклик функції пострілу */
        {
          kind: "call",
          total: 1,
          scene: S.bossArt,
          story: S.m5.s3.story,
          fname: function () { return S.m5.s3.fname; },
          statusHint: S.m5.s3.status,
          onCall: async function (i, api, g) {
            api.print(S.m5.s3.sPower.replace("%Z%", g.power || 99));
            await api.pause(500);
            api.print(S.m5.s3.sBeam, "alert");
            api.beep(120, 0.5, 0.08, "sawtooth");
            await api.pause(650);
            api.print(S.m5.s3.sHit, "ok");
            api.scene(S.victoryArt);
            api.okBeep();
            await api.pause(900);
            api.print(S.m5.s3.sCollapse, "ok");
            await api.pause(1100);
          }
        }
      ]
    }
  ];
}

/* ================= ВИБІР СЦЕНАРІЮ ================= */
function pickScenario() {
  var idx;
  if (STATION_NUM !== null) {
    // номер станції визначає сценарій (по колу)
    idx = ((STATION_NUM - 1) % SCENARIOS.length + SCENARIOS.length) % SCENARIOS.length;
  } else {
    // без параметра — випадковий сценарій на кожен запуск/скидання
    idx = Math.floor(Math.random() * SCENARIOS.length);
  }
  scenario = SCENARIOS[idx];
  MISSIONS = makeMissions(scenario);
  stationLabel = scenario.imya + (STATION_NUM !== null ? "-" + STATION_NUM : "");
  // шапка та пролог — від сценарію
  $("#station-title").textContent = scenario.zaklad + " «" + stationLabel + "»";
  $("#prologue-art").textContent = T(scenario.prologGlitch);
  $("#prologue-btn").textContent = T(scenario.prologBtn);
}

/* ================= ПОБУДОВА ФОРМИ-КОНСТРУКТОРА ================= */

// Знайти опис поля за ключем
function fieldDef(st, key) {
  for (var i = 0; i < st.fields.length; i++) {
    if (st.fields[i].key === key) return st.fields[i];
  }
  return null;
}

// Поле значення змінної, що АДАПТУЄТЬСЯ до обраного типу:
//   «число»     → лише цифри;
//   «текст»     → вільний ввід рядка;
//   «істинність»→ селект «так» / «ні».
// Так гравець на дотик відчуває, які значення зберігає кожен тип.
function makeValueWidget(type, def, st) {
  var el;
  if (type === "takni") {
    el = document.createElement("select");
    el.className = "fld";
    [
      { v: "",    label: "▼ так чи ні" },
      { v: "tak", label: "так" },
      { v: "ni",  label: "ні" }
    ].forEach(function (o) {
      var opt = document.createElement("option");
      opt.value = o.v;
      opt.textContent = o.label;
      el.appendChild(opt);
    });
  } else if (type === "tekst") {
    // вільне текстове поле — можна вводити будь-які рядки
    el = document.createElement("input");
    el.type = "text";
    el.className = "fld";
    el.autocomplete = "off";
    el.spellcheck = false;
    el.maxLength = 12;
    if (def.phText && SHOW_PH) el.placeholder = def.phText;
  } else {
    // «число» (і поки тип не обрано) — приймає лише цифри
    el = document.createElement("input");
    el.type = "text";
    el.className = "fld narrow";
    el.autocomplete = "off";
    el.spellcheck = false;
    el.maxLength = def.len || 2;
    el.inputMode = "numeric";
    if (def.phNum && SHOW_PH) el.placeholder = def.phNum;
    el.addEventListener("input", function () {
      var v = this.value;
      var cleaned = v.replace(/[^0-9]/g, "");
      if (cleaned !== v) {
        this.value = cleaned;
        setStatus("Це поле приймає лише цифри.");
      }
    });
  }
  el.dataset.key = def.key;
  el.addEventListener("input",  function () { this.classList.remove("need"); });
  el.addEventListener("change", function () { this.classList.remove("need"); setStatus(resolveVal(st.statusHint)); });
  return el;
}

// Створити елемент поля (select / назва / число / адаптивне значення)
function makeField(def, st) {
  if (def.kind === "adaptive") return makeValueWidget("chyslo", def, st);
  var el;
  if (def.kind === "select") {
    el = document.createElement("select");
    el.className = "fld";
    def.options.forEach(function (o) {
      var opt = document.createElement("option");
      opt.value = o.v;
      opt.textContent = o.label;
      el.appendChild(opt);
    });
  } else {
    el = document.createElement("input");
    el.type = "text";
    el.className = "fld";
    el.autocomplete = "off";
    el.spellcheck = false;
    // плейсхолдери-підказки показуємо лише коли hints=1 (типово)
    if (def.placeholder && SHOW_PH) el.placeholder = def.placeholder;
    if (def.kind === "name") {
      el.maxLength = 12;
      // Назва: лише a-z та _, цифри дозволені, але не на початку.
      // Заборонені символи просто не вводяться — з м'якою підказкою.
      el.addEventListener("input", function () {
        var v = this.value;
        var cleaned = v.toLowerCase().replace(/[^a-z0-9_]/g, "").replace(/^[0-9]+/, "");
        if (cleaned !== v) {
          this.value = cleaned;
          setStatus("Назва пишеться латинськими літерами a-z, можна _ і цифри (але не на початку).");
        }
      });
    } else { // number
      el.classList.add("narrow");
      el.maxLength = def.len || 2;
      el.inputMode = "numeric";
      // Числове поле приймає лише цифри
      el.addEventListener("input", function () {
        var v = this.value;
        var cleaned = v.replace(/[^0-9]/g, "");
        if (cleaned !== v) {
          this.value = cleaned;
          setStatus("Це поле приймає лише цифри.");
        }
      });
    }
  }
  el.dataset.key = def.key;
  // Коли гравець щось змінює — знімаємо підсвічення і повертаємо підказку кроку
  el.addEventListener("input",  function () { this.classList.remove("need"); });
  el.addEventListener("change", function () { this.classList.remove("need"); setStatus(resolveVal(st.statusHint)); });
  return el;
}

// Побудувати форму-конструктор кроку
function buildForm(st, myEpoch) {
  var form = document.createElement("form");
  form.className = "construct";
  var line = document.createElement("div");
  line.className = "codeline";

  st.template.forEach(function (tok) {
    if (typeof tok === "string") {
      var s = document.createElement("span");
      s.className = "tok";
      s.textContent = tok;
      line.appendChild(s);
    } else if (tok.nl) {
      var b = document.createElement("div");
      b.className = "brk";
      line.appendChild(b);
    } else {
      line.appendChild(makeField(fieldDef(st, tok.f), st));
    }
  });
  form.appendChild(line);

  var btn = document.createElement("button");
  btn.type = "submit";
  btn.className = "btn";
  btn.textContent = "ВИКОНАТИ ▶";
  form.appendChild(btn);

  // Адаптивне поле значення: коли гравець змінює тип у селекті,
  // поле значення перебудовується під цей тип
  var adef = null;
  st.fields.forEach(function (d) { if (d.kind === "adaptive") adef = d; });
  if (adef) {
    var typSel = form.querySelector('[data-key="typ"]');
    if (typSel) {
      typSel.addEventListener("change", function () {
        var old = form.querySelector('[data-key="' + adef.key + '"]');
        var neu = makeValueWidget(typSel.value, adef, st);
        old.parentNode.replaceChild(neu, old);
      });
    }
  }

  form.addEventListener("submit", function (e) {
    e.preventDefault();
    tryExecute(st, form, myEpoch);
  });

  elWork.appendChild(form);
  // Фокус на перше поле — для проходження лише з клавіатури
  var first = form.querySelector("[data-key]");
  if (first) first.focus();
}

/* ================= API ДЛЯ АНІМАЦІЙ УСПІХУ ================= */
function makeApi(myEpoch) {
  return {
    print: function (t, cls) { if (epoch === myEpoch) print(t, cls); },
    scene: function (t)      { if (epoch === myEpoch) setScene(t); },
    status: function (t)     { if (epoch === myEpoch) setStatus(t); },
    pause: sleep,
    okBeep: okBeep,
    clickBeep: clickBeep,
    beep: beep
  };
}

/* ================= ВИКОНАННЯ КРОКУ-КОНСТРУКТОРА ================= */
async function tryExecute(st, form, myEpoch) {
  if (busy || typing || epoch !== myEpoch) return;

  // 1. Збираємо значення; порожні поля — не помилка, а м'яка підказка
  var vals = {};
  var fields = form.querySelectorAll("[data-key]");
  for (var i = 0; i < fields.length; i++) {
    var el = fields[i];
    vals[el.dataset.key] = el.value.trim();
    if (!vals[el.dataset.key]) {
      el.classList.add("need");
      // emptyHint може бути функцією від уже зібраних значень
      // (щоб підказка пасувала до обраного типу)
      var eh = fieldDef(st, el.dataset.key).emptyHint;
      storyHint(typeof eh === "function" ? eh(vals) : eh);
      el.focus();
      return;
    }
  }

  // 2. Сюжетна перевірка місії
  var res = st.check(vals, game.vars);
  if (!res.ok) {
    // Деякі «неправильні» відповіді мають кумедний сюжетний наслідок-анімацію
    if (res.play) {
      busy = true;
      var tmp = form.querySelectorAll("input, select, button");
      tmp.forEach(function (el) { el.disabled = true; });
      await res.play(makeApi(myEpoch), game.vars);
      busy = false;
      if (epoch !== myEpoch) return;
      tmp.forEach(function (el) { el.disabled = false; });
    }
    storyHint(res.hint);
    if (res.key) {
      var bad = form.querySelector('[data-key="' + res.key + '"]');
      if (bad) { bad.classList.add("need"); bad.focus(); }
    }
    return;
  }

  // 3. Успіх: показуємо справжній синтаксис і граємо анімацію результату
  busy = true;
  form.querySelectorAll("input, select, button").forEach(function (el) { el.disabled = true; });
  print("> " + st.code(vals, game.vars), "exec");
  okBeep();
  setStatus("Виконую…");
  await st.success(vals, makeApi(myEpoch), game.vars);
  busy = false;
  offerContinue(myEpoch);
}

/* ================= КНОПКА ПРОДОВЖЕННЯ ПІСЛЯ УСПІХУ =================
   Без автопереходу: після успішної анімації гравець спокійно читає
   звіт і сам тисне кнопку. Виняток — фінальний крок гри: після нього
   одразу йдуть титри (як і було). */
function offerContinue(myEpoch) {
  if (epoch !== myEpoch) return;
  var m = MISSIONS[game.mission];
  var lastStep = game.step + 1 >= m.steps.length;
  if (lastStep && game.mission + 1 >= MISSIONS.length) {
    advance(); // перемога → титри без зупинки
    return;
  }
  var btn = document.createElement("button");
  btn.type = "button";
  btn.className = "btn big";
  btn.textContent = lastStep ? "ПРИЙНЯТИ НАСТУПНЕ ЗАВДАННЯ ▸" : "ПРОДОВЖИТИ ▸";
  btn.addEventListener("click", function () {
    if (epoch !== myEpoch) return;
    clickBeep();
    advance();
  });
  elWork.appendChild(btn);
  btn.focus();
  scrollDown();
  setStatus(lastStep
    ? "Прочитай звіт місії і натисни «ПРИЙНЯТИ НАСТУПНЕ ЗАВДАННЯ»"
    : "Прочитай звіт і натисни «ПРОДОВЖИТИ»");
}

/* ================= КРОК-ВИКЛИК: ГРАВЕЦЬ САМ ДРУКУЄ ВИКЛИК ================= */
function buildCall(st, myEpoch) {
  var made = 0;
  var form = document.createElement("form");
  form.className = "construct";

  var line = document.createElement("div");
  line.className = "codeline";
  var prompt = document.createElement("span");
  prompt.className = "tok";
  prompt.textContent = "виклик: ";
  line.appendChild(prompt);

  var input = document.createElement("input");
  input.type = "text";
  input.className = "fld call";
  input.autocomplete = "off";
  input.spellcheck = false;
  input.maxLength = 20;
  // плейсхолдер-підказка (керується ?hints=0/1)
  if (SHOW_PH) input.placeholder = st.fname(game.vars) + "()";
  // М'який фільтр: лише латиниця, цифри, _ та дужки — решта не вводиться
  input.addEventListener("input", function () {
    var v = this.value;
    var cleaned = v.toLowerCase().replace(/[^a-z0-9_()]/g, "");
    if (cleaned !== v) {
      this.value = cleaned;
      setStatus("Для виклику потрібні лише латинські літери a-z, _ і круглі дужки ().");
    }
    this.classList.remove("need");
  });
  line.appendChild(input);
  form.appendChild(line);

  var btn = document.createElement("button");
  btn.type = "submit";
  btn.className = "btn";
  btn.textContent = "ВИКОНАТИ ▶";
  form.appendChild(btn);

  form.addEventListener("submit", async function (e) {
    e.preventDefault();
    if (busy || typing || epoch !== myEpoch) return;

    var expected = st.fname(game.vars);
    var raw = input.value.trim();
    var v = raw.replace(/\s+/g, "");

    // М'яка розбірка вводу — кожен випадок дає свою сюжетну підказку
    if (!v) {
      input.classList.add("need");
      storyHint("Поле порожнє. Напиши виклик функції: назва і круглі дужки — " + expected + "()");
      input.focus();
      return;
    }
    if (v !== expected + "()") {
      var hint;
      if (v === expected) {
        hint = "Майже! Назва правильна, але без круглих дужок () функція не запуститься — саме дужки означають «виконати». Допиши ().";
      } else {
        var m = v.match(/^([a-z_][a-z0-9_]*)\((.*)\)$/);
        if (m && m[1] === expected) {
          hint = "Функції " + expected + " нічого не треба класти в дужки. Виклич просто " + expected + "().";
        } else if (m) {
          hint = "Функції з назвою «" + m[1] + "» тут ніхто не знає. Твій протокол звати " + expected + " — виклич " + expected + "().";
        } else if (v.indexOf("(") === -1 && v.indexOf(")") === -1) {
          hint = "Команду «" + v + "» пам'ять не впізнає. Виклик має вигляд «назва + дужки»: " + expected + "().";
        } else {
          hint = "Дужки не зійшлися. Виклик має вигляд: " + expected + "().";
        }
      }
      input.classList.add("need");
      storyHint(hint);
      input.focus();
      return;
    }

    // Виклик правильний — виконуємо протокол
    busy = true;
    input.disabled = true;
    btn.disabled = true;
    made++;
    print("> " + expected + "();", "exec");
    okBeep();
    await st.onCall(made, makeApi(myEpoch), game.vars);
    busy = false;
    if (epoch !== myEpoch) return;
    if (made >= st.total) {
      offerContinue(myEpoch);
    } else {
      input.disabled = false;
      btn.disabled = false;
      input.value = "";
      input.focus();
    }
  });

  elWork.appendChild(form);
  input.focus();
}

/* ================= ПЕРЕБІГ ГРИ ================= */
function resolveVal(x) { return typeof x === "function" ? x(game.vars) : x; }

async function runStep() {
  var myEpoch = ++epoch;
  busy = false;
  var m = MISSIONS[game.mission];
  var st = m.steps[game.step];

  elMission.textContent = "МІСІЯ " + (game.mission + 1) + "/" + MISSIONS.length + " • " + m.title;
  setHelpPage(m.help);
  if (game.mission === 0) elHelp.classList.add("pulse"); // перша місія підсвічує довідник

  if (st.enter) st.enter(game.vars);
  elStory.innerHTML = "";
  elWork.innerHTML = "";
  setScene(resolveVal(st.scene));

  await typeStory(resolveVal(st.story), myEpoch);
  if (epoch !== myEpoch) return;

  if (st.kind === "form") buildForm(st, myEpoch);
  else buildCall(st, myEpoch);
  setStatus(resolveVal(st.statusHint));
}

// Перехід до наступного кроку / місії / фіналу
function advance() {
  var m = MISSIONS[game.mission];
  if (game.step + 1 < m.steps.length) {
    game.step++;
    runStep();
  } else if (game.mission + 1 < MISSIONS.length) {
    game.mission++;
    game.step = 0;
    runStep();
  } else {
    showFinale();
  }
}

/* ================= ФІНАЛ ================= */
var idleTimer = null;

function armIdleReset() {
  // Режим стенда: 60 с бездіяльності на фіналі — і гра сама повертається на пролог
  clearTimeout(idleTimer);
  idleTimer = setTimeout(resetGame, 60000);
}

async function showFinale() {
  var myEpoch = ++epoch;
  game.state = "finale";
  elMission.textContent = "МІСІЮ ВИКОНАНО • 5/5";
  elStory.innerHTML = "";
  elWork.innerHTML = "";
  setScene(scenario.victoryArt);
  armIdleReset();

  var lines = scenario.finaleLines.concat([
    "",
    "! ═══ ТИТРИ ═══",
    "! Ти щойно ПРОГРАМУВАВ: змінні • умови • цикли • функції",
    "! Саме з цих цеглинок складаються всі програми світу — від ігор до бортових комп'ютерів.",
    ""
  ]).concat(INVITE_TEXT);

  await typeStory(lines, myEpoch);
  if (epoch !== myEpoch) return;

  var btn = document.createElement("button");
  btn.type = "button";
  btn.className = "btn big";
  btn.textContent = "ПОЧАТИ СПОЧАТКУ ↺";
  btn.addEventListener("click", function () { resetGame(); });
  elWork.appendChild(btn);
  btn.focus();
  setStatus("Натисни «ПОЧАТИ СПОЧАТКУ», щоб передати місію наступному оператору");
}

/* ================= ПРОЛОГ / СКИДАННЯ ================= */
function startGame() {
  if (game.state !== "prologue") return;
  ensureAudio();
  okBeep();
  game.state = "play";
  game.mission = 0;
  game.step = 0;
  game.vars = {};
  elPrologue.classList.add("hidden");
  elHelp.classList.remove("open");
  elHelpTgl.setAttribute("aria-expanded", "false");
  stopIntroMusic(); // музика інтро плавно згасає з початком гри
  runStep();
}

function resetGame() {
  // Повне повернення на пролог (для наступного гостя).
  // Без ?station сценарій обирається випадково наново.
  epoch++;
  clearTimeout(idleTimer);
  busy = false;
  typing = false;
  skipRequested = false;
  game.state = "prologue";
  game.mission = 0;
  game.step = 0;
  game.vars = {};
  elStory.innerHTML = "";
  elWork.innerHTML = "";
  setScene("");
  elMission.textContent = "•";
  setStatus("Очікування сигналу…");
  elHelp.classList.remove("open", "pulse");
  elHelpTgl.setAttribute("aria-expanded", "false");
  pickScenario();
  elPrologue.classList.remove("hidden");
  // знову на пролозі — музика інтро повертається (якщо файл є і звук увімкнено;
  // живлення вже вмикали, тож жест користувача був)
  if (!elGate) playIntroMusic();
  $("#prologue-btn").focus();
}

/* ================= ЕКРАН ЖИВЛЕННЯ ================= */
// Одноразовий крок викладача перед грою: вмикає фулскрін і зникає.
// resetGame сюди не повертає — гості бачать одразу пролог.
var elGate = $("#powergate");
function powerOn() {
  if (!elGate) return;
  var root = document.documentElement;
  if (root.requestFullscreen) root.requestFullscreen().catch(function () {});
  elGate.remove();
  elGate = null;
  playIntroMusic(); // клік по живленню — жест користувача, автоплей дозволений
  $("#prologue-btn").focus();
}
elGate.addEventListener("click", powerOn);

/* ================= ГЛОБАЛЬНІ ПОДІЇ ================= */
elPrologue.addEventListener("click", startGame);
$("#prologue-btn").addEventListener("click", function (e) { e.stopPropagation(); startGame(); });

// Клік по екрану під час друку — миттєво додрукувати
elScreen.addEventListener("click", function () {
  if (typing) skipRequested = true;
});

window.addEventListener("keydown", function (e) {
  // Поки термінал «вимкнено» — будь-який Enter/пробіл лише вмикає живлення
  if (elGate && (e.key === "Enter" || e.key === " ")) {
    e.preventDefault();
    powerOn();
    return;
  }
  // Ctrl+Shift+R — миттєве скидання на пролог (для викладача)
  if (e.ctrlKey && e.shiftKey && e.code === "KeyR") {
    e.preventDefault();
    resetGame();
    return;
  }
  // Enter на пролозі — старт
  if (game.state === "prologue" && (e.key === "Enter" || e.key === " ")) {
    e.preventDefault();
    startGame();
    return;
  }
  // Enter під час друку — пропустити анімацію тексту
  // (пробіл не чіпаємо: він потрібен у текстових полях)
  if (typing && e.key === "Enter") {
    e.preventDefault();
    skipRequested = true;
  }
});

// Будь-яка активність на фіналі відкладає автоскидання
["keydown", "mousedown", "mousemove"].forEach(function (ev) {
  window.addEventListener(ev, function () {
    if (game.state === "finale") armIdleReset();
  });
});

/* ================= СТАРТ ================= */
pickScenario();
$("#powergate-btn").focus();
</script>
</body>
</html>
